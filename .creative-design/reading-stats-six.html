<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阅听记录 · 六种设计预览</title>
<style>
:root{--accent:#d97b62;--page:#151516;--surface:#202022;--soft:#29292b;--text:#eeeef0;--secondary:#a1a1a7;--muted:#73737b;--line:#ffffff15;--board:#0d0d0e;--toolbar:#19191bef;--phone-width:370px;color-scheme:dark}
html[data-theme=light]{--page:#f6f6f5;--surface:#fff;--soft:#ececea;--text:#242427;--secondary:#707077;--muted:#929299;--line:#00000012;--board:#eaeae7;--toolbar:#fafaf9ef;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--board);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.5;transition:background .2s,color .2s}button,input,select{font:inherit}button,select,input[type=color]{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{color:inherit}button,select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px}button:hover{border-color:var(--accent)}.board-head{max-width:1256px;margin:auto;padding:38px 28px 24px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:600}h1{font-size:27px;font-weight:620;letter-spacing:-1px;margin:9px 0 8px}.intro{color:var(--secondary);font-size:13px;margin:0}.controls{position:sticky;top:0;z-index:10;border-block:1px solid var(--line);background:var(--toolbar);backdrop-filter:blur(18px)}.control-inner{max-width:1256px;margin:auto;display:flex;align-items:center;gap:18px;padding:13px 28px;flex-wrap:wrap}.control{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--secondary)}.segmented{display:flex;gap:3px;background:var(--soft);padding:3px;border-radius:10px}.segmented button{border:0;background:none;padding:5px 11px;font-size:12px}.segmented button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px #00000012}.swatches{display:flex;gap:7px}.swatch{padding:0;width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--swatch);outline-offset:3px}.swatch[aria-pressed=true]{outline:1px solid var(--secondary)}input[type=color]{width:25px;height:26px;padding:0;border:0;background:transparent}select{padding:5px 8px;font-size:12px;color:var(--text)}.selection-status{margin-left:auto;font-size:12px;color:var(--accent)}main{max-width:1256px;margin:auto;padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--phone-width)),1fr));gap:34px 24px;align-items:start}main.focused{max-width:520px;grid-template-columns:1fr}.variant[hidden]{display:none}.caption{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 3px 12px}.caption h2{font-size:15px;font-weight:600;margin:0}.caption p{font-size:11px;color:var(--secondary);margin:3px 0 0}.pick{font-size:11px;padding:5px 9px;white-space:nowrap}.pick[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}.phone{max-width:var(--phone-width);margin:auto;background:var(--page);border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative;min-height:650px;box-shadow:0 12px 36px #0000000c}.statusbar{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;padding:15px 24px 0;letter-spacing:.4px}.status-icons{display:flex;align-items:center;gap:5px}.status-icons svg{width:15px;height:15px}.page-head{display:flex;justify-content:space-between;align-items:center;padding:28px 22px 24px;gap:10px}.page-head h3{font-size:25px;letter-spacing:-.8px;margin:0;font-weight:680;white-space:nowrap}.tools{display:flex;gap:8px}.tool{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}.tool svg{width:16px;height:16px;color:var(--secondary)}.content{padding:0 22px 80px}.label{color:var(--secondary);font-size:11px;letter-spacing:.2px}.number{font-variant-numeric:tabular-nums;letter-spacing:-.7px;font-weight:550}.duration{display:flex;align-items:baseline;gap:6px;white-space:nowrap}.duration strong{font-size:32px;font-weight:570;letter-spacing:-1.1px;line-height:1.4}.duration .minute{font-size:24px;margin-left:5px}.unit{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}.subvalue{font-size:18px;line-height:1.5;font-weight:560;white-space:nowrap;letter-spacing:-.3px}.subvalue small{font-size:10px;font-weight:400;color:var(--secondary);margin:0 3px;letter-spacing:0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:27px 0 4px}.section-title h4{font-size:16px;margin:0;font-weight:600}.section-title span{font-size:10px;color:var(--muted)}.book{display:flex;gap:13px;padding:17px 0;border-bottom:1px solid var(--line)}.cover{width:54px;height:73px;flex:none;border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px #00000012;color:#f2e7d2}.cover::after{content:"";position:absolute;inset:5px;border:1px solid #e5d7b25c}.cover span{font:15px/1.4 Georgia,"Songti SC",serif;writing-mode:vertical-rl;letter-spacing:2px;position:relative;z-index:1}.cover.c1{background:linear-gradient(140deg,#3d4d49,#172b2a)}.cover.c1::before{content:"";position:absolute;width:60px;height:60px;border:1px solid #a1b5a057;border-radius:50%;left:20px;top:30px}.cover.c2{background:linear-gradient(140deg,#a69885,#5b5b60)}.cover.c3{background:linear-gradient(140deg,#65687d,#303746)}.book-info{min-width:0;flex:1}.book-title{font-size:13px;font-weight:540;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:1px 0 5px}.author{font-size:10px;color:var(--muted);margin-bottom:12px}.progress-meta{font-size:10px;color:var(--secondary);display:flex;align-items:center;gap:4px}.progress-meta svg{width:10px;height:10px;color:var(--accent)}.progress-meta .elapsed{margin-left:7px;color:var(--muted)}.progress{height:2px;background:var(--soft);margin-top:9px;border-radius:3px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:var(--progress);border-radius:3px}.tabbar{position:absolute;bottom:13px;left:16px;right:16px;height:56px;display:flex;align-items:center;justify-content:space-around;border-radius:18px;border:1px solid var(--line);background:var(--toolbar);backdrop-filter:blur(16px)}.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9px}.tab svg{height:18px;width:18px}.tab.active{color:var(--accent)}.home-indicator{width:78px;height:3px;border-radius:4px;background:var(--text);opacity:.25;position:absolute;bottom:5px;left:calc(50% - 39px)}
/* 01 / 无卡片：通过字号和细线建立层级 */
.v1 .summary{padding:3px 0 18px;border-bottom:1px solid var(--line)}.v1 .duration{margin:6px 0 15px}.v1 .duration strong{font-size:36px}.v1 .duration .minute{font-size:27px}.v1 .summary-foot{display:flex;align-items:center;gap:13px;font-size:11px;color:var(--secondary)}.v1 .summary-foot b{font-weight:550;color:var(--text)}.v1 .summary-foot .dot{width:3px;height:3px;border-radius:50%;background:var(--accent);flex:none}.v1 .section-title{margin-top:22px}
/* 02 / 等权三列：最低高度、以列表为主 */
.v2 .summary{display:grid;grid-template-columns:1.2fr .75fr 1.2fr;padding:17px 0;border-block:1px solid var(--line);gap:8px}.v2 .stat+.stat{border-left:1px solid var(--line);padding-left:10px}.v2 .stat .label{font-size:10px;white-space:nowrap}.v2 .stat-main{font-size:20px;margin-top:7px;font-weight:550;letter-spacing:-.8px;white-space:nowrap}.v2 .stat-main span{font-size:12px;letter-spacing:-.4px}.v2 .stat .suffix{color:var(--muted);font-size:10px;margin-top:2px}.v2 .stat:first-child .suffix{color:var(--accent)}.v2 .section-title{margin-top:28px}
/* 03 / 主次两栏：主数据左侧，辅助数据竖向排列 */
.v3 .summary{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;padding:20px 17px;background:var(--surface);border:1px solid var(--line);border-radius:16px;align-items:center}.v3 .duration{margin-top:10px;gap:4px;flex-wrap:wrap;white-space:normal}.v3 .duration strong{font-size:28px}.v3 .duration .minute{font-size:20px;margin-left:0}.v3 .right{padding-left:17px;border-left:1px solid var(--line);display:grid;gap:13px}.v3 .right .subvalue{font-size:15px;margin-top:2px}.v3 .right .streak{color:var(--accent)}.v3 .right .label{font-size:10px}
/* 04 / 轻主题横条：很淡的主题色，非大面积实色 */
.v4 .summary{padding:17px 18px 15px;background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 13%,transparent);border-radius:15px}.v4 .summary-top{display:flex;justify-content:space-between;align-items:center}.v4 .mark{width:24px;height:24px;border-radius:7px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;color:var(--accent)}.v4 .mark svg{width:13px;height:13px}.v4 .duration{margin-top:3px}.v4 .duration strong{font-size:31px}.v4 .duration .minute{font-size:23px}.v4 .summary-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:13px;border-top:1px solid color-mix(in srgb,var(--accent) 13%,transparent)}.v4 .summary-foot .subvalue{font-size:14px;margin-top:3px}.v4 .summary-foot .label{font-size:10px}
/* 05 / 数据清单：每行一个指标，右侧对齐 */
.v5 .summary{padding:0 0 3px}.v5 .ledger-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.v5 .ledger-row:first-child{padding-top:2px;padding-bottom:14px}.v5 .ledger-row:first-child .ledger-value{font-size:25px;font-weight:580}.v5 .ledger-value{font-size:16px;font-weight:500;white-space:nowrap;letter-spacing:-.4px}.v5 .ledger-value small{font-size:10px;font-weight:400;color:var(--muted);margin-inline:3px}.v5 .ledger-row:first-child .label::before{content:"";display:inline-block;height:9px;width:3px;background:var(--accent);border-radius:2px;margin-right:7px}.v5 .section-title{margin-top:22px}
/* 06 / 标题下的一句话：取消独立统计区 */
.v6 .page-head{padding-bottom:14px}.v6 .summary{padding:0 0 19px}.v6 .sentence{font-size:13px;line-height:1.8;color:var(--secondary);margin:0}.v6 .sentence b{font-size:17px;font-weight:580;color:var(--text);letter-spacing:-.3px}.v6 .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.v6 .chip{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--secondary);border:1px solid var(--line);border-radius:7px;padding:6px 8px}.v6 .chip svg{width:12px;height:12px;color:var(--accent)}.v6 .chip b{font-weight:500;color:var(--text)}.v6 .section-title{margin-top:0;border-top:1px solid var(--line);padding-top:21px}
.footer{font-size:12px;color:var(--secondary);max-width:1256px;margin:0 auto;padding:0 28px 36px}.footer strong{color:var(--text);font-weight:500}.sprite{position:absolute;width:0;height:0;overflow:hidden}@media(max-width:700px){.board-head{padding:24px 18px 18px}h1{font-size:23px}.control-inner{padding:10px 18px;gap:10px 16px}.selection-status{width:100%;margin:0}main{padding:22px 16px;gap:28px}.phone{border-radius:23px}.caption{max-width:var(--phone-width);margin:0 auto 12px}.footer{padding:0 18px 28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v7l-4-2v-5Z"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></symbol>
<symbol id="edit" viewBox="0 0 24 24"><path d="M13 5H5v14h14v-8M10 14l1-4 9-9 3 3-9 9Z"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 3 4v15c3-2 6-1 9 1 3-2 6-3 9-1V4c-3-2-6-1-9 1Zm0 0v15"/></symbol>
<symbol id="record" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h2m3 0h2m-7 3h2"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
<symbol id="signal" viewBox="0 0 24 24"><path d="M4 20v-4m5 4v-8m5 8V8m5 12V4"/></symbol>
<symbol id="battery" viewBox="0 0 24 24"><rect x="2" y="6" width="17" height="12" rx="3"/><path d="M22 10v4M5 9h10v6H5Z"/></symbol>
</defs></svg>
<header class="board-head"><div class="eyebrow">阅听记录 / DESIGN STUDY</div><h1>六种方向，放进真实页面里看。</h1><p class="intro">相同数据、相同列表，只比较统计区。示例数据不连接真实记录。</p></header>
<div class="controls"><div class="control-inner">
 <div class="control"><span>外观</span><div class="segmented"><button data-mode="light" aria-pressed="false">浅色</button><button data-mode="dark" aria-pressed="true">深色</button></div></div>
 <div class="control"><span>主题色</span><div class="swatches"><button class="swatch" style="--swatch:#d97b62" data-color="#d97b62" aria-label="陶土色" aria-pressed="true"></button><button class="swatch" style="--swatch:#b47abf" data-color="#b47abf" aria-label="紫色" aria-pressed="false"></button><button class="swatch" style="--swatch:#5e9f8a" data-color="#5e9f8a" aria-label="绿色" aria-pressed="false"></button><button class="swatch" style="--swatch:#6b97cf" data-color="#6b97cf" aria-label="蓝色" aria-pressed="false"></button><button class="swatch" style="--swatch:#c4516a" data-color="#c4516a" aria-label="玫瑰色" aria-pressed="false"></button></div><input type="color" id="customColor" value="#d97b62" aria-label="自定义主题色"></div>
 <label class="control">宽度<select id="width"><option value="370">标准 370</option><option value="320">窄屏 320</option><option value="410">宽屏 410</option></select></label>
 <label class="control">查看<select id="focus"><option value="all">全部对比</option><option value="1">01 留白排版</option><option value="2">02 三栏速览</option><option value="3">03 主次分栏</option><option value="4">04 轻主题卡</option><option value="5">05 对齐清单</option><option value="6">06 一句话概览</option></select></label>
 <div class="selection-status" id="selection" aria-live="polite">选一个方向，再微调。</div>
</div></div>
<main id="gallery"></main>
<p class="footer">六个方案都使用 <strong>累计阅听时长、连续阅听、本月阅听</strong>。没有收音机、没有虚构趋势图，也不使用固定品牌色。</p>
<script>
const icon = name => `<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><use href="#${name}"></use></svg>`;
const duration = `<div class="duration"><strong class="number">190</strong><span class="unit">小时</span><strong class="minute number">54</strong><span class="unit">分钟</span></div>`;
const variants = [
 {id:1,name:'留白排版',desc:'无卡片 · 累计时长为主，辅助数据收成一行',html:`<div class="summary"><div class="label">累计阅听时长</div>${duration}<div class="summary-foot"><span>连续阅听 <b>15 天</b></span><i class="dot"></i><span>本月 <b>190 小时 54 分钟</b></span></div></div>`},
 {id:2,name:'三栏速览',desc:'低占高 · 三个指标横向平铺，列表更靠上',html:`<div class="summary"><div class="stat"><div class="label">累计阅听时长</div><div class="stat-main number">190<span>h 54m</span></div><div class="suffix">小时 / 分钟</div></div><div class="stat"><div class="label">连续阅听</div><div class="stat-main number">15</div><div class="suffix">天</div></div><div class="stat"><div class="label">本月阅听</div><div class="stat-main number">190<span>h 54m</span></div><div class="suffix">小时 / 分钟</div></div></div>`},
 {id:3,name:'主次分栏',desc:'左右布局 · 主数据占左侧，辅助数据靠右',html:`<div class="summary"><div><div class="label">累计阅听时长</div>${duration}</div><div class="right"><div><div class="label">连续阅听</div><div class="subvalue streak">15 <small>天</small></div></div><div><div class="label">本月阅听</div><div class="subvalue">190<small>时</small>54<small>分</small></div></div></div></div>`},
 {id:4,name:'轻主题卡',desc:'低对比底色 · 用一点主题色建立整体感',html:`<div class="summary"><div class="summary-top"><span class="label">累计阅听时长</span><span class="mark">${icon('book')}</span></div>${duration}<div class="summary-foot"><div><div class="label">连续阅听</div><div class="subvalue">15 <small>天</small></div></div><div><div class="label">本月阅听</div><div class="subvalue">190 <small>小时</small> 54 <small>分钟</small></div></div></div></div>`},
 {id:5,name:'对齐清单',desc:'纯文字 · 标签左对齐，数据右对齐',html:`<div class="summary"><div class="ledger-row"><span class="label">累计阅听时长</span><span class="ledger-value number">190<small>小时</small>54<small>分钟</small></span></div><div class="ledger-row"><span class="label">连续阅听</span><span class="ledger-value number">15<small>天</small></span></div><div class="ledger-row"><span class="label">本月阅听</span><span class="ledger-value number">190<small>小时</small>54<small>分钟</small></span></div></div>`},
 {id:6,name:'一句话概览',desc:'最轻量 · 统计融入标题下方，突出记录列表',html:`<div class="summary"><p class="sentence">累计阅听 <b>190</b> 小时 <b>54</b> 分钟</p><div class="chips"><span class="chip">${icon('record')}连续阅听 <b>15 天</b></span><span class="chip">${icon('clock')}本月 <b>190 时 54 分</b></span></div></div>`}
];
function books(){return [['谁让他修仙的！','有声的紫襟','已听 8%','12 小时 2 分钟','c1','修仙','play','8%'],['月亮即天宫','爵士巴隆','已读 0%','第 1 章 序章','c2','月亮','book','2%'],['道士不好惹','困的睡不着','已听 16%','3 小时 26 分钟','c3','问道','play','16%']].map(([title,author,progress,elapsed,cover,coverTitle,type,width])=>`<div class="book"><div class="cover ${cover}"><span>${coverTitle}</span></div><div class="book-info"><div class="book-title">${title}</div><div class="author">${author}</div><div class="progress-meta">${icon(type)}${progress}<span class="elapsed">${elapsed}</span></div><div class="progress" style="--progress:${width}"><i></i></div></div></div>`).join('')}
const gallery=document.getElementById('gallery');
gallery.innerHTML=variants.map(v=>`<article class="variant v${v.id}" data-id="${v.id}"><div class="caption"><div><h2>${String(v.id).padStart(2,'0')} / ${v.name}</h2><p>${v.desc}</p></div><button class="pick" aria-pressed="false" data-pick="${v.id}">选这个</button></div><div class="phone"><div class="statusbar"><span>16:17</span><span class="status-icons">${icon('signal')}${icon('battery')}</span></div><div class="page-head"><h3>阅听记录</h3><div class="tools"><span class="tool">${icon('filter')}</span><span class="tool">${icon('clock')}</span><span class="tool">${icon('edit')}</span></div></div><div class="content">${v.html}<div class="section-title"><h4>阅听记录</h4><span>最近阅听</span></div>${books()}</div><div class="tabbar">${[['home','首页'],['book','书架'],['record','记录'],['user','我的']].map(([id,label])=>`<span class="tab ${id==='record'?'active':''}">${icon(id)}${label}</span>`).join('')}</div><div class="home-indicator"></div></div></article>`).join('');
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.documentElement.dataset.theme=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
function setAccent(value){document.documentElement.style.setProperty('--accent',value);document.getElementById('customColor').value=value;document.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===value)))}
document.querySelectorAll('[data-color]').forEach(button=>button.addEventListener('click',()=>setAccent(button.dataset.color)));
document.getElementById('customColor').addEventListener('input',e=>setAccent(e.target.value));
document.getElementById('width').addEventListener('change',e=>document.documentElement.style.setProperty('--phone-width',`${e.target.value}px`));
document.getElementById('focus').addEventListener('change',e=>{const id=e.target.value;gallery.classList.toggle('focused',id!=='all');document.querySelectorAll('.variant').forEach(v=>v.hidden=id!=='all'&&v.dataset.id!==id)});
document.querySelectorAll('[data-pick]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-pick]').forEach(b=>{const selected=b===button;b.setAttribute('aria-pressed',String(selected));b.textContent=selected?'已选择':'选这个'});document.getElementById('selection').textContent=`已选 ${button.dataset.pick.padStart(2,'0')} · ${variants.find(v=>String(v.id)===button.dataset.pick).name}，把编号告诉我即可。`}));
</script>
</body>
</html>
