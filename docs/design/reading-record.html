:root{color-scheme:light;--paper:#f5efe3;--canvas:#f8f5ed;--surface:#fffcf5;--ink:#2f3b32;--muted:#636f64;--faint:#71796e;--line:#d9d9cd;--brand:#496d5c;--soft:#e6ebe0;--pill:#f1f1e7;--burnt:#a35c41;--danger:#9b392d;--serif:"Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;--page: min(1120px,calc(100% - 96px));--margin:max(48px,calc((100% - 1120px)/2));--r:16px}
:root[data-theme=dark]{color-scheme:dark;--paper:#282c26;--canvas:#212721;--surface:#2c332c;--ink:#f0efdf;--muted:#bbc4b8;--faint:#aab3a6;--line:#434d42;--brand:#a7c4ab;--soft:#37463a;--pill:#364034;--burnt:#e4a586;--danger:#ffab98}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--canvas);font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0;-webkit-tap-highlight-color:transparent}button:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button:disabled{cursor:default;opacity:.45}button:active:not(:disabled){transform:translateY(1px)}
.ic{font-family:HMSymbol;font-weight:normal;font-style:normal;line-height:1;display:inline-block;flex:none;font-size:1.12em}
.frame{width:var(--page);margin-inline:auto}h1,h2,h3,p{margin:0}button,summary{touch-action:manipulation}
.mast{border-bottom:1px solid var(--line);background:var(--canvas);position:relative;z-index:4}
.mast-inner{height:62px;display:flex;align-items:center;justify-content:space-between}
.wordmark{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:.08em}
.wordmark img{width:33px;height:33px;border-radius:10px;object-fit:cover}.mast-tools,.tools,.pills,.flow,.metric,.chart-legend{display:flex;align-items:center}.mast-tools{gap:18px;color:var(--muted);font-size:13px}
.mast-tools time{letter-spacing:.03em}.mast-tools>i{width:1px;height:15px;background:var(--line)}.circle,.action{height:37px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:99px}
.circle{width:37px;font-size:17px}.circle:hover,.action:hover,.tool:hover{background:var(--soft)}.action{font-size:13px;padding:0 12px}.tools{gap:6px}
.harmony-statusbar{display:none}.harmony-statusbar-icons{width:96px;height:13px;position:relative;flex:0 0 auto}
.harmony-statusbar-icon{position:absolute;top:50%;transform:translateY(-50%);background-size:contain;background-repeat:no-repeat;background-position:center}

[data-theme=dark] .intro:before{mix-blend-mode:screen;filter:invert(1) grayscale(1);opacity:.38}
.title-line,.history-head,.card-head,.date-line,.editbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.title-line{position:relative;align-items:center}h1{font-size:clamp(30px,3vw,39px);line-height:1.2;letter-spacing:.035em;font-weight:750}
.tools{background:color-mix(in srgb,var(--canvas) 82%,transparent);backdrop-filter:blur(12px);border-radius:99px}
.poem{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 13px;margin:15px 0 13px}.poem small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.poem q{quotes:none;font-family:var(--serif);font-size:18px;letter-spacing:.07em;font-weight:600}.poem cite{font-size:12px;font-style:normal;color:var(--muted)}
.pills{gap:8px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}.pill{font-size:12px;background:linear-gradient(125deg,color-mix(in srgb,var(--surface) 91%,transparent),var(--pill));display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;overflow:hidden;clip-path:inset(0 round 99px);backdrop-filter:blur(10px);color:var(--muted)}.pill .ic,.pill b{color:var(--brand)}.pill b{font-weight:650}
.overview{display:grid;grid-template-columns:1.57fr 1fr;gap:18px}.feature,.week{border-radius:var(--r);position:relative;overflow:hidden}
.feature{background:linear-gradient(112deg,#254e41,#375f4d 65%,#5b7256);color:#faf2dd;min-height:207px;isolation:isolate;display:flex;align-items:center}
.feature:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background-image:repeating-linear-gradient(78deg,transparent 0px,transparent 2px,#f5ebc804 2px,#f5ebc804 3px)}
.feature-lines{mask-image:linear-gradient(90deg,transparent,#000 23%);position:absolute;right:0;bottom:0;width:70%;height:100%;z-index:-1;opacity:.4}
.feature-copy{padding:24px 0 24px 28px;position:relative;z-index:1;max-width:60%}.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;display:flex;align-items:center;gap:8px}.eyebrow .dash{width:18px;height:1px;background:currentColor}.feature .eyebrow{color:#d1ddc6}
.feature h2{font-family:var(--serif);font-size:36px;letter-spacing:.08em;line-height:1.32;margin:9px 0 4px;color:#fff5df}
.feature-meta{font-size:13px;color:#dbe2d1;letter-spacing:.03em}.feature .resume{display:inline-flex;align-items:center;gap:9px;border-radius:30px;background:#f5edd9;color:#284c3d;padding:8px 17px;font-size:13px;font-weight:650;margin-top:19px;box-shadow:0 2px 4px #1426191a}.resume:hover{filter:brightness(1.06)}
.book-stage{position:absolute;right:7%;top:50%;transform:translateY(-50%) rotate(9deg) skewY(-2deg);width:111px;aspect-ratio:2/3;filter:drop-shadow(7px 12px 7px #14271d78)}
.book-stage:before{content:"";position:absolute;inset:2px -6px -2px 4px;background:repeating-linear-gradient(90deg,#cabb98 0px,#ebe0c5 1px,#ede3ca 2px);border-radius:2px 4px 3px 0;transform:skewY(-4deg);border-right:2px solid #30463a}
.cover{width:100%;height:100%;display:block;border-radius:2px 4px 4px 2px;overflow:hidden}.book-stage .cover{position:relative;outline:1px solid #eadbb777}.feature .stage-shadow{position:absolute;right:1%;bottom:5%;width:35%;height:12%;background:radial-gradient(ellipse,#1b34288a,transparent 67%);transform:rotate(-5deg);filter:blur(4px)}
.week{background:var(--surface);border:1px solid var(--line);padding:19px 23px 15px}.week-heading{display:flex;justify-content:space-between;align-items:center;gap:8px}.week h2{font-size:15px;letter-spacing:.05em}.week-range{color:var(--muted);font:12px/1.4 "Segoe UI",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.07em}.metric{align-items:baseline;gap:4px;margin:2px 0 0;font-size:12px;color:var(--muted)}.metric strong{font:500 35px/1.2 Georgia,serif;color:var(--ink);font-variant-numeric:lining-nums}.metric strong:not(:first-child){margin-left:4px}
.chart-wrap{margin-top:7px}.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;position:relative;background:repeating-linear-gradient(to top,transparent 0,transparent 20px,color-mix(in srgb,var(--line) 50%,transparent) 20px,color-mix(in srgb,var(--line) 50%,transparent) 21px) left top/100% 62px no-repeat}
.day{height:82px;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:5px;position:relative;border-radius:6px}.day:hover,.day[aria-pressed=true]{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.stack{display:flex;flex-direction:column-reverse;overflow:hidden;border-radius:4px 4px 1px 1px;width:14px;background:#dfe6d8}.readbar{background:#54755f}.audiobar{background:#c4a780}.day small{font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted)}.day:last-child small{font-weight:bold;color:var(--brand)}
.chart-legend{font-size:11px;color:var(--muted);justify-content:flex-end;gap:11px;margin-top:4px;line-height:1.3}.chart-legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:2px;background:#54755f}.dot.audio{background:#c4a780}.week-toggle{display:none}.day-readout{font-size:11px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.history{margin-top:26px}.history h2{font-size:23px;letter-spacing:.045em;line-height:1.3}.filters{display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--soft) 64%,transparent);padding:3px;border-radius:99px}.filters button{font-size:13px;padding:5px 14px;border-radius:99px;color:var(--muted);min-height:30px}.filters button[aria-pressed=true]{background:var(--brand);color:var(--surface);font-weight:600}
.date-line{color:var(--muted);font-size:12px;gap:9px;margin:16px 0 5px;justify-content:flex-start}.date-line:after{content:"";background:var(--line);height:1px;flex:1;margin-left:3px}.date-line strong{color:var(--ink);font-size:14px;font-weight:650}.date-line time{font-variant-numeric:tabular-nums}
.record{display:grid;grid-template-columns:54px 42px minmax(0,1fr) minmax(100px,17%) 45px;align-items:center;gap:16px;min-height:80px;padding:7px 10px 7px 0;position:relative}.record+.record:before{content:"";position:absolute;top:0;left:70px;right:0;height:1px;background:color-mix(in srgb,var(--line) 65%,transparent)}
.timestamp{font:13px/1.4 "Segoe UI",sans-serif;color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums}.thumb{height:60px;width:42px;box-shadow:1px 2px 4px #49463726;border-radius:2px;overflow:hidden;position:relative}
.info{text-align:left;min-width:0;line-height:1.5}.info strong{font-size:16px;font-weight:650;display:block}.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:4px}.meta .ic{color:var(--brand)}.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small-dot{width:2px;height:2px;background:currentColor;border-radius:50%;flex:none;opacity:.8}
.progress-cell{display:flex;flex-direction:column;align-items:flex-end;gap:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.track{height:3px;width:88px;border-radius:99px;background:var(--line);overflow:hidden}.track i{display:block;background:#7c9b81;height:100%;border-radius:inherit}
.round-resume{width:36px;height:36px;justify-self:end;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-size:15px}.round-resume:hover{background:color-mix(in srgb,var(--soft) 70%,var(--brand))}.record:hover .info strong{color:var(--brand)}
.editbar{justify-content:flex-end;font-size:13px;gap:16px;border-bottom:1px solid var(--line);padding:10px 0}.editbar span{margin-right:auto}.danger{color:var(--danger)}.selectbox{width:19px;height:19px;accent-color:var(--brand);justify-self:end}.empty{text-align:center;padding:32px 12px;color:var(--muted)}

 const isAudio=b.type==='听书';const prefix=isAudio?'听至':'读至';
 const checked=state.selected.has(b.id);
 return '<article class="record"><time class="timestamp">'+b.time+'</time><button class="thumb" data-detail="'+b.id+'" aria-label="查看'+b.name+'">'+jacket(b)+'</button><button class="info" data-detail="'+b.id+'"><strong class="clip">'+b.name+'</strong><span class="meta">'+icon(typeIcon(b.type))+'<span>'+b.type+'</span><i class="small-dot"></i><span class="clip">'+b.chapter+'</span><span class="mobile-stamp"> · '+b.time+'</span></span></button><div class="progress-cell"><span>'+prefix+' '+b.pct+'%</span><span class="track"><i style="width:'+b.pct+'%"></i></span></div>'+(state.edit?'<input type="checkbox" class="selectbox" data-select="'+b.id+'" aria-label="选择'+b.name+'" '+(checked?'checked':'')+'>':'<button class="round-resume" data-resume="'+b.id+'" aria-label="继续'+(isAudio?'收听':'阅读')+b.name+'">'+icon(isAudio?'play_fill':'book_open_fill')+'</button>')+'</article>';
}
function renderRecords(){
 $('filters').innerHTML=filters.map(f=>'<button data-filter="'+f+'" aria-pressed="'+(state.filter===f)+'">'+f+'</button>').join('');
 let html='',date=0;
 for(const b of visibleBooks()){
  if(date!==b.date){date=b.date;html+='<h3 class="date-line"><strong>'+(date===18?'今天':date===17?'昨天':'星期一')+'</strong><time>11月'+date+'日</time></h3>'}
  html+=row(b);
 }
 $('records').innerHTML=html||'<p class="empty">还没有'+(state.filter==='全部'?'阅听':state.filter)+'记录</p>';
 $('edit').innerHTML=icon(state.locked?'lock':state.edit?'checkmark':'square_and_pencil')+'<span class="tool-label">'+(state.locked?'已锁定':state.edit?'完成':'编辑')+'</span>';
 $('editbar').hidden=!state.edit;
 $('editbar').innerHTML='<span>已选 '+state.selected.size+' 本</span><button data-batch="all">全选</button><button class="danger" data-batch="delete" '+(!state.selected.size?'disabled':'')+'>删除</button>';
}
function dialog(title,body){$('panel-title').textContent=title;$('dialog-body').innerHTML=body;if(!$('panel').open)$('panel').showModal()}
function showBook(b,resume){
 const label=b.type==='听书'?'收听':'阅读';
 const line=(k,v)=>'<div class="detail-line"><small>'+k+'</small><span>'+v+'</span></div>';
 dialog(resume?label+'位置':'书籍详情','<div class="dialog-book"><div class="thumb">'+jacket(b)+'</div><div><h3>'+b.name+'</h3><p class="note">'+b.author+' · '+b.type+'</p></div></div>'+line('上次'+label,'11月'+b.date+'日 '+b.time)+line('所在章节',b.chapter)+line(b.type==='听书'?'章节内位置':'全书进度',b.pos||b.pct+'%')+line('本次时长',b.min+' 分钟')+'<div class="dialog-actions">'+(resume?'<button class="primary" data-close>返回记录</button>':'<button class="primary" data-resume="'+b.id+'">继续'+label+'</button>')+'</div>');
}
function editMode(on){state.edit=on;state.selected.clear();renderRecords()}
function toggleSelection(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);renderRecords()}
let hold=0,held=false;
function beginHold(fn){clearTimeout(hold);held=false;hold=setTimeout(()=>{held=true;fn()},520)}
function stopHold(){clearTimeout(hold)}
document.addEventListener('pointerdown',e=>{
 const edit=e.target.closest('#edit'),record=e.target.closest('#records [data-detail]');
 if(edit&&!state.edit&&!state.locked)beginHold(()=>{state.locked=true;renderRecords()});
 else if(record&&!state.edit&&!state.locked)beginHold(()=>{editMode(true);toggleSelection(record.dataset.detail)});
});
['pointerup','pointercancel','pointermove'].forEach(type=>document.addEventListener(type,e=>{if(type!=='pointermove'||Math.abs(e.movementY)+Math.abs(e.movementX)>4)stopHold()}));
document.addEventListener('click',e=>{
 if(held){held=false;return}
 const btn=e.target.closest('button,input[data-select]');if(!btn)return;
 const d=btn.dataset;
 if(d.close!==undefined||btn.id==='close')return $('panel').close();
 if(d.filter){state.filter=d.filter;state.selected.clear();renderRecords();return}
 if(d.day!==undefined){
  const active=btn.getAttribute('aria-pressed')!=='true';
  document.querySelectorAll('.day').forEach(x=>x.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed',String(active));const i=Number(d.day);$('day-readout').textContent=active?(12+i)+'日 · 读'+days[i][0]+'分 / 听'+days[i][1]+'分':'';return
 }
 if(d.select)return toggleSelection(d.select);
 if(d.resume||d.detail){const id=d.resume||d.detail;if(state.edit&&!$('panel').open&&d.detail)return toggleSelection(id);const b=state.records.find(x=>x.id===id);if(b)showBook(b,Boolean(d.resume));return}
 if(btn.id==='edit'){if(state.locked){state.locked=false;renderRecords()}else editMode(!state.edit);return}
 if(btn.id==='week-toggle'){const on=$('week').classList.toggle('open');btn.setAttribute('aria-expanded',String(on));return}
 if(btn.id==='theme'){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';btn.innerHTML=icon(dark?'sun_max':'moon_fill');return}
 if(btn.id==='notes'){dialog('我的摘录','<blockquote class="excerpt">山光悦鸟性，潭影空人心。</blockquote><p class="note">常建《题破山寺后禅院》 · 11月16日</p>');return}
 if(btn.id==='unsaved'){
  const list=state.records.filter(b=>!b.saved);
  dialog('未收藏记录',list.length?list.map(b=>'<button class="detail-line" style="width:100%;text-align:left" data-detail="'+b.id+'"><b>'+b.name+'</b><small>'+b.type+' '+icon('chevron_right')+'</small></button>').join(''):'<p class="empty">暂无未收藏记录</p>');return
 }
 if(d.batch==='all'){const list=visibleBooks();state.selected=state.selected.size===list.length?new Set():new Set(list.map(x=>x.id));renderRecords();return}
 if(d.batch==='delete'){
  dialog('删除所选记录？','<p>将清除这 '+state.selected.size+' 本书的示例记录和进度，累计阅听时长保留。</p><div class="dialog-actions"><button class="secondary" data-close>取消</button><button class="primary" data-batch="confirm">删除记录</button></div>');return
 }
 if(d.batch==='confirm'){state.records=state.records.filter(b=>!state.selected.has(b.id));$('panel').close();editMode(false);renderFeature()}
});
$('panel').addEventListener('click',e=>{if(e.target===$('panel')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.edit&&!$('panel').open)editMode(false)});
$('heading').addEventListener('dblclick',()=>window.scrollTo({top:0,behavior:'smooth'}));
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
$('theme').innerHTML=icon(document.documentElement.dataset.theme==='dark'?'sun_max':'moon_fill');
renderFeature();setChart();renderRecords();
</script>
</body>
</html>
